<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>π · web</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <aside id="sidebar">
    <!-- top icon row: search / filter / new workspace -->
    <div class="side-top">
      <button class="side-ico" id="sess-search-toggle" title="搜索会话" aria-label="搜索会话">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="side-ico" id="sess-filter" title="只看当前工作区" aria-label="筛选" aria-pressed="false">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4h11M4.5 8h7M6.5 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="side-ico side-ico-end" id="new-workspace" title="新建工作区" aria-label="新建工作区">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M1.9 4.6c0-.7.6-1.2 1.2-1.2h3l1.3 1.5h5.5c.7 0 1.2.5 1.2 1.2v5.8c0 .7-.5 1.2-1.2 1.2H3.1c-.6 0-1.2-.5-1.2-1.2V4.6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M11.9 2.2v3M10.4 3.7h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- search (hidden until the magnifier is pressed) -->
    <div class="search-wrap hidden" id="search-wrap">
      <input id="sess-search" type="text" placeholder="搜索会话…" spellcheck="false" />
    </div>

    <!-- new chat -->
    <button id="btn-new" class="new-chat-btn" title="在当前工作区新建对话">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.35"/>
        <path d="M8 5.4v5.2M5.4 8h5.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
      </svg>
      <span>新建对话</span>
    </button>

    <!-- workspace groups; each holds its sessions -->
    <div class="sess-scroll" id="sess-scroll">
      <div id="sess-groups"></div>
    </div>

    <div class="side-spacer"></div>

    <!-- Footer: profile / settings -->
    <div class="side-bottom">
      <div class="profile-row">
        <a class="avatar-sm" id="profile-avatar" href="https://github.com/chenminghuan-cn/pi-web" target="_blank" rel="noopener noreferrer" title="在 GitHub 上打开">
          <img alt="pi-web" src="https://github.com/chenminghuan-cn.png?size=96" onerror="this.classList.add('broken')" />
        </a>
        <div class="profile-info">
          <a class="profile-name" id="profile-name" href="https://github.com/chenminghuan-cn/pi-web" target="_blank" rel="noopener noreferrer">pi-web</a>
          <div class="profile-ver" id="profile-ver">v0.0.0</div>
        </div>
        <button id="theme-btn" class="icon-btn" title="切换明暗主题" aria-label="切换明暗主题">
          <svg class="th-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.2 9.6A5.7 5.7 0 0 1 6.4 2.8a5.7 5.7 0 1 0 6.8 6.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <svg class="th-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.3 3.3l1.2 1.2M11.5 11.5l1.2 1.2M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <div class="topbar-left">
        <div id="chat-title" class="chat-title">New chat</div>
      </div>
      <div id="chat-meta" class="chat-meta"></div>
      <button id="rb-toggle" class="rb-toggle-btn" title="展开/收起工具面板" aria-pressed="false">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.2 2.6v10.8" stroke="currentColor" stroke-width="1.4"/>
          <rect class="rb-pane" x="10.7" y="3.2" width="3.1" height="9.6" rx="1" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <div id="messages"></div>
    <div id="round-rail" class="round-rail" aria-label="对话轮次导航"></div>

    <footer id="composer-wrap">
      <div class="composer-tools-top">
        <div id="model-pill" class="pill" title="Switch model">
          <span id="model-label">—</span>
          <span class="caret">▾</span>
          <div id="model-menu" class="popup-menu hidden"></div>
        </div>
        <div id="thinking-pill" class="pill" title="Thinking level">
          <span id="thinking-label">medium</span>
          <span class="caret">▾</span>
          <div id="thinking-menu" class="popup-menu hidden"></div>
        </div>
      </div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message π…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button type="submit" id="btn-send" title="Send">➤</button>
      </form>
      <div id="footer-status" class="footer-status"></div>
    </footer>
  </main>

  <!-- WORK AREA: tabbed editor/browser/terminal + optional file tree -->
  <section id="workbar" class="open">
    <!-- Drag handle to resize workbar -->
    <div class="work-resize" id="work-resize" title="Drag to resize"></div>

    <!-- Tab strip + content -->
    <div class="work-main">
      <div class="work-tabs" id="work-tabs">
        <div class="work-tabs-left" id="work-tabs-list"></div>
        <div class="work-tabs-right">
          <button class="work-tab-add" id="work-tab-add" title="New tab">＋</button>
        </div>
      </div>
      <div class="work-content" id="work-content">
        <!-- Empty placeholder: Codex-style tool picker -->
        <div class="work-empty" id="work-empty">
          <div class="work-empty-ico">🗖</div>
          <div class="work-empty-title">工具</div>
          <div class="work-empty-sub">选择要打开的工具</div>
          <div class="tool-list">
            <div class="tool-item" data-kind="terminal">
              <span class="tool-ico">⌨</span>
              <span class="tool-name">终端</span>
              <span class="tool-hint">⌘`</span>
            </div>
            <div class="tool-item" data-kind="browser">
              <span class="tool-ico">🌐</span>
              <span class="tool-name">浏览器</span>
              <span class="tool-hint">⌘⇧B</span>
            </div>
            <div class="tool-item" data-kind="file">
              <span class="tool-ico">📄</span>
              <span class="tool-name">打开文件</span>
              <span class="tool-hint">⌘P</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- File tree (right column, only visible when a file tab is active) -->
    <div class="work-tree" id="work-tree">
      <div class="tree-header">
        <input id="tree-search" class="tree-search" placeholder="筛选文件…" spellcheck="false" />
        <button class="fs-btn" id="tree-reload" title="Refresh">⟳</button>
      </div>
      <div class="tree-root" id="tree-root"></div>
    </div>

    <!-- Tab "new" menu -->
    <div id="newtab-menu" class="ctx-menu hidden">
      <div class="ctx-item" data-kind="terminal">⌨ 终端</div>
      <div class="ctx-item" data-kind="browser">🌐 浏览器</div>
      <div class="ctx-item" data-kind="file">📄 打开文件…</div>
    </div>
  </section>

  <!-- chat context menu -->
  <div id="ctx-menu" class="ctx-menu hidden">
    <div class="ctx-item" data-act="rename">Rename</div>
    <div class="ctx-item danger" data-act="delete">Delete</div>
  </div>

  <!-- project switcher popup -->
  <div id="proj-menu" class="ctx-menu hidden" style="min-width:300px;max-height:360px;overflow-y:auto"></div>

  <!-- hidden folder picker for "open folder" -->
  <input type="file" id="folder-picker" webkitdirectory directory multiple style="display:none" />

  <!-- custom modal dialog -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="modal-title">Title</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
